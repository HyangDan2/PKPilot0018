name: Deploy Sigrún to GitHub Pages

# Every push to main is the candidate release: the same checks a release tag
# runs, then the Pages upload. The release folder stays an artifact; nothing
# here creates, moves or deletes a tag.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test

      - name: Release build (web + portable, reproducible)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          npm run release:build

      - name: Verify release artifacts and rebuild
        run: npm run release:verify -- --repro

      - name: Portable offline E2E
        run: npm run qa:portable
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Portable tutorial E2E
        run: npm run qa:tutorials:portable
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          retention-days: 30

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
