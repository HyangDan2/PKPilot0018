<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%PRODUCT_TITLE%</title>
    <meta
      name="description"
      content="%PRODUCT_DESCRIPTION%"
    />
    <meta name="author" content="%PRODUCT_AUTHOR%" />
    <meta name="theme-color" content="#FAFAFD" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="%PRODUCT_CANONICAL%" />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%PRODUCT_SHORT_NAME%" />
    <meta name="application-name" content="%PRODUCT_SHORT_NAME%" />

    <!-- Favicons (dual-skew 규격) -->
    <link rel="icon" href="./favicon.ico?v=20261122-icons" sizes="any" />
    <link rel="icon" href="./favicon.svg?v=20261122-icons" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32x32.png?v=20261122-icons" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=20261122-icons" sizes="180x180" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%PRODUCT_AUTHOR%" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ko_KR" />
    <meta property="og:title" content="%PRODUCT_TITLE%" />
    <meta property="og:description" content="%PRODUCT_SUMMARY%" />
    <meta property="og:url" content="%PRODUCT_CANONICAL%" />
    <meta property="og:image" content="%PRODUCT_OG_IMAGE%" />
    <meta property="og:image:secure_url" content="%PRODUCT_OG_IMAGE%" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%PRODUCT_TITLE%" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%PRODUCT_TITLE%" />
    <meta name="twitter:description" content="%PRODUCT_SUMMARY%" />
    <meta name="twitter:image" content="%PRODUCT_OG_IMAGE%" />
    <meta name="twitter:image:alt" content="%PRODUCT_TITLE%" />

    <!-- The stored theme is applied before the bundle loads, so a dark-mode
         reader never sees a white flash. The key carries the edition namespace. -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('%PRODUCT_SETTINGS_KEY%') || 'null');
        if (saved && saved.theme) document.documentElement.dataset.theme = saved.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>%PRODUCT_SHORT_NAME% needs JavaScript to run its statistical engine in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
