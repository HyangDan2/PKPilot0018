<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="./favicon.ico?v=20261122-og" sizes="any" />
<link rel="icon" href="./favicon.svg?v=20261122-og" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=20261122-og" sizes="180x180" />
<title>Statelia — responsive QA frame</title>
<style>
  html, body { margin: 0; background: #0B1020; }
  .frame { display: block; border: 0; background: #FAFAFD; }
</style>
</head>
<body>
  <!-- Responsive QA aid: renders the live app in an exact-size frame (?w=1440&h=900). Not linked from the UI. -->
  <iframe class="frame" src="./index.html" title="Statelia"></iframe>
  <script>
    var p = new URLSearchParams(location.search);
    var f = document.querySelector('iframe');
    f.style.width = (parseInt(p.get('w'), 10) || 1440) + 'px';
    f.style.height = (parseInt(p.get('h'), 10) || 900) + 'px';
    f.src = './index.html?qa=' + Date.now();
  </script>
</body>
</html>
